services:
  - type: web
    name: ai-career-assistant
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: node server/server.js
    domains:
      - aicareer.com
      - www.aicareer.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
